openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mister — il fantacalcio manageriale
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feed
    description: Feed eventi della lega (gazzetta)
  - name: templates
    description: Template profili (Classico/Esploratore/Manageriale)
  - name: leagues
    description: Leghe fantacalcio
  - name: federations
    description: Regolamenti e feature flags delle leghe
  - name: competitions
    description: Competizioni dentro una lega
  - name: markets
    description: Eventi di mercato
  - name: teams
    description: Squadre fantacalcio dei manager
  - name: players
    description: Giocatori Serie A
  - name: contracts
    description: Contratti pluriennali
  - name: lineups
    description: Formazioni giornata
  - name: matches
    description: Partite con punteggi fanta
  - name: auctions
    description: Aste live

paths:
  # ─── FEED ─────────────────────────────────────────────────────────────────
  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Feed eventi della lega (risultati, colpi, ecc.)
      parameters:
        - in: query
          name: leagueId
          schema:
            type: string
          required: false
          description: Filtra per lega specifica
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          required: false
        - in: query
          name: cursor
          schema:
            type: string
          required: false
          description: Cursore ISO timestamp per paginazione
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── TEMPLATES ───────────────────────────────────────────────
  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: Lista template attivi
      parameters:
        - in: query
          name: active_only
          schema:
            type: boolean
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateProfile"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Dettaglio template
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateProfile"
        "404":
          description: Not found

  /superadmin/templates:
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Crea nuovo template (superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateProfile"

  /superadmin/templates/{id}:
    patch:
      operationId: updateTemplate
      tags: [templates]
      summary: Aggiorna template (superadmin)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateProfile"
        "404":
          description: Not found
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Elimina template custom (superadmin — solo non-system)
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Template di sistema non eliminabile
        "404":
          description: Not found

  # ─── FEDERATIONS STANDALONE ─────────────────────────────────
  /federations:
    get:
      operationId: listFederations
      tags: [federations]
      summary: Lista federazioni dell'utente corrente (o filtrate per proprietario)
      parameters:
        - in: query
          name: owner_user_id
          schema:
            type: string
          required: false
          description: Filtra per proprietario. Se omesso e l'utente è autenticato, restituisce le federazioni dell'utente corrente.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Federation"

  # ─── LEAGUES ─────────────────────────────────────────────────
  /leagues:
    get:
      operationId: listLeagues
      tags: [leagues]
      summary: Lista leghe
      parameters:
        - in: query
          name: admin_user_id
          schema:
            type: string
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
    post:
      operationId: createLeague
      tags: [leagues]
      summary: Crea una lega con wizard (nome, parametri asta, squadre)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueWizardResponse"
        "400":
          description: Validation error
        "409":
          description: Nomi all'asta duplicati

  /leagues/{id}:
    get:
      operationId: getLeague
      tags: [leagues]
      summary: Dettaglio lega
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          description: Not found
    patch:
      operationId: updateLeague
      tags: [leagues]
      summary: Aggiorna lega
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          description: Not found
    delete:
      operationId: deleteLeague
      tags: [leagues]
      summary: Elimina lega
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "204":
          description: Deleted

  /leagues/{id}/stats:
    get:
      operationId: getLeagueStats
      tags: [leagues]
      summary: Statistiche aggregate della lega
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueStats"
        "404":
          description: Not found

  # ─── INVITI ───────────────────────────────────────────────────
  /leagues/{id}/join:
    post:
      operationId: joinLeague
      tags: [leagues]
      summary: Entra nella lega con codice invito
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinLeagueRequest"
      responses:
        "200":
          description: OK (già membro o nuovo ingresso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinLeagueResponse"
        "401":
          description: Non autenticato
        "403":
          description: Codice invito non valido
        "404":
          description: Lega non trovata
        "409":
          description: Lega al completo

  /leagues/{id}/claim:
    post:
      operationId: claimSlot
      tags: [leagues]
      summary: Rivendica uno slot libero (crea o riusa la propria società)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimSlotRequest"
      responses:
        "201":
          description: Slot rivendicato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimSlotResponse"
        "401":
          description: Non autenticato
        "403":
          description: Non sei membro di questa lega o non sei proprietario della società
        "404":
          description: Slot o società non trovati
        "409":
          description: Slot già preso (SLOT_TAKEN) o hai già uno slot in questa lega (SLOT_CONFLICT)

  /leagues/{id}/invite:
    get:
      operationId: getLeagueInvite
      tags: [leagues]
      summary: Info invito e stato slot (admin)
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueInviteInfo"
        "401":
          description: Non autenticato
        "403":
          description: Non sei admin
        "404":
          description: Lega non trovata

  # ─── FEDERATIONS ─────────────────────────────────────────────
  /leagues/{leagueId}/federation:
    get:
      operationId: getFederation
      tags: [federations]
      summary: Regolamento della lega
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Federation"
        "404":
          description: Not found
    patch:
      operationId: updateFederation
      tags: [federations]
      summary: Aggiorna regolamento (admin lega)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FederationUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Federation"
        "404":
          description: Not found

  # ─── COMPETITIONS ─────────────────────────────────────────────
  /leagues/{leagueId}/competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      summary: Lista competizioni della lega
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"
    post:
      operationId: createCompetition
      tags: [competitions]
      summary: Crea competizione
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /leagues/{leagueId}/competitions/{id}:
    get:
      operationId: getCompetition
      tags: [competitions]
      summary: Dettaglio competizione
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"
        "404":
          description: Not found
    patch:
      operationId: updateCompetition
      tags: [competitions]
      summary: Aggiorna competizione
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"
        "404":
          description: Not found
    delete:
      operationId: deleteCompetition
      tags: [competitions]
      summary: Elimina competizione
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "204":
          description: Deleted

  /leagues/{leagueId}/hub:
    get:
      operationId: getLeagueHub
      tags: [competitions]
      summary: Hub di lega — identità + giornata + card competizioni con fasi (S-hub)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - in: query
          name: fantaTeamId
          required: false
          schema:
            type: string
          description: ID squadra fanta dell'utente per evidenziare posizione e prossima sfida
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueHubResponse"
        "404":
          description: Lega non trovata

  /competitions/{competitionId}/phases:
    get:
      operationId: getCompetitionPhases
      tags: [competitions]
      summary: Fasi di una competizione
      parameters:
        - in: path
          name: competitionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitionPhase"
        "404":
          description: Competizione non trovata

  /competitions/{competitionId}/coppa:
    get:
      operationId: getCompetitionCoppa
      tags: [competitions]
      summary: Vista completa coppa (gironi + tabellone)
      parameters:
        - in: path
          name: competitionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoppaResponse"
        "404":
          description: Competizione non trovata

  # ─── MARKETS ─────────────────────────────────────────────────
  /leagues/{leagueId}/markets:
    get:
      operationId: getLeagueMarkets
      tags: [markets]
      summary: Lista eventi di mercato
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketEvent"
    post:
      operationId: createMarketEvent
      tags: [markets]
      summary: Crea evento di mercato
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEvent"

  /leagues/{leagueId}/markets/{id}:
    get:
      operationId: getMarketEvent
      tags: [markets]
      summary: Dettaglio evento mercato
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEvent"
        "404":
          description: Not found
    patch:
      operationId: updateMarketEvent
      tags: [markets]
      summary: Aggiorna evento mercato
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketEventUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEvent"
        "404":
          description: Not found
    delete:
      operationId: deleteMarketEvent
      tags: [markets]
      summary: Elimina evento mercato
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "204":
          description: Deleted

  # ─── FANTA TEAMS ─────────────────────────────────────────────
  /leagues/{leagueId}/teams:
    get:
      operationId: listFantaTeams
      tags: [teams]
      summary: Lista squadre della lega
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FantaTeam"
    post:
      operationId: createFantaTeam
      tags: [teams]
      summary: Crea squadra
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FantaTeamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FantaTeam"

  /leagues/{leagueId}/teams/{id}:
    get:
      operationId: getFantaTeam
      tags: [teams]
      summary: Dettaglio squadra
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FantaTeam"
        "404":
          description: Not found
    patch:
      operationId: updateFantaTeam
      tags: [teams]
      summary: Aggiorna squadra
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FantaTeamUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FantaTeam"
        "404":
          description: Not found

  # ─── PLAYERS ─────────────────────────────────────────────────
  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: Lista giocatori Serie A
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [GK, DEF, MID, ATT]
          required: false
        - in: query
          name: team
          schema:
            type: string
          required: false
        - in: query
          name: search
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          required: false
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerList"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Dettaglio giocatore
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found

  # ─── CONTRACTS ───────────────────────────────────────────────
  /leagues/{leagueId}/contracts:
    get:
      operationId: getLeagueContracts
      tags: [contracts]
      summary: Lista contratti della lega
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Crea contratto (post-asta)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /leagues/{leagueId}/contracts/{id}:
    get:
      operationId: getContract
      tags: [contracts]
      summary: Dettaglio contratto
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "404":
          description: Not found
    patch:
      operationId: updateContract
      tags: [contracts]
      summary: Aggiorna stato contratto (rescissione, clausola pagata, ecc.)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "404":
          description: Not found

  # ─── DASHBOARD (wow endpoint) ─────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [leagues]
      summary: Riepilogo globale per un utente (leghe, competizioni attive, mercati aperti)
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ─── VOTO ALGORITHM CONFIG ────────────────────────────────
  /voto-algorithm-configs:
    get:
      operationId: listVotoAlgorithmConfigs
      tags: [superadmin]
      summary: Elenco configurazioni algoritmo voto
      parameters:
        - name: federationId
          in: query
          schema:
            type: string
            nullable: true
          description: Se omesso, ritorna tutte. Stringa speciale 'null' per filtrare solo system default. Altrimenti ID federazione.
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/VotoAlgorithmConfigStatus"
      responses:
        "200":
          description: Lista config, ordinate per createdAt desc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VotoAlgorithmConfig"
    post:
      operationId: createVotoAlgorithmConfig
      tags: [superadmin]
      summary: Crea una nuova configurazione algoritmo voto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VotoAlgorithmConfigCreate"
      responses:
        "201":
          description: Config creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotoAlgorithmConfig"
        "409":
          description: Vincolo unique violato (status=active già presente per la federazione)

  /voto-algorithm-configs/{id}:
    patch:
      operationId: updateVotoAlgorithmConfig
      tags: [superadmin]
      summary: Modifica parziale di una configurazione algoritmo voto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VotoAlgorithmConfigUpdate"
      responses:
        "200":
          description: Config aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotoAlgorithmConfig"
        "403":
          description: Operazione bloccata (es. tentativo di archiviare riga is_protected)
        "404":
          description: Config non trovata

  /voto-algorithm-configs/recalculate:
    post:
      operationId: recalculateVotoMister
      tags: [superadmin]
      summary: Ricalcola voto_mister su tutti i player_giornata_stats
      description: Usa la config attiva del federation_id specificato (o system default se omesso). Operazione sincrona, ~1s per 600 record.
      parameters:
        - name: federationId
          in: query
          schema:
            type: string
            nullable: true
      responses:
        "200":
          description: Ricalcolo completato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotoAlgorithmRecalculateResponse"
        "404":
          description: Nessuna config attiva trovata

  # ─── LINEUPS ─────────────────────────────────────────────
  /lineups:
    get:
      operationId: getLineups
      tags: [lineups]
      summary: Recupera la formazione di una squadra per una giornata
      parameters:
        - in: query
          name: fantaTeamId
          schema:
            type: string
          required: true
        - in: query
          name: season
          schema:
            type: integer
          required: true
        - in: query
          name: round
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Lineup trovato, o null se non ancora compilato
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Lineup"
                  - type: "null"
    put:
      operationId: putLineup
      tags: [lineups]
      summary: Crea o aggiorna la formazione (upsert)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupInput"
      responses:
        "200":
          description: Lineup salvato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lineup"
        "400":
          description: Payload non valido (errori di validazione)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
        "403":
          description: Lineup bloccato — deadline passata

  /players/{playerId}/scheda:
    get:
      operationId: getPlayerScheda
      tags: [players]
      summary: Scheda aggregata giocatore (anagrafica + contesto lega + rendimento + stats)
      parameters:
        - in: path
          name: playerId
          required: true
          schema:
            type: integer
        - in: query
          name: fantaTeamId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Scheda giocatore aggregata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerScheda"
        "404":
          description: Giocatore non trovato

  /fanta-teams/{fantaTeamId}/rosa:
    get:
      operationId: getFantaTeamRosa
      tags: [fanta-teams]
      summary: Rosa della squadra fanta raggruppata per ruolo (P/D/C/A)
      parameters:
        - in: path
          name: fantaTeamId
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Rosa della squadra con metadati di budget e struttura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FantaTeamRosa"
        "404":
          description: Squadra non trovata

  /roster:
    get:
      operationId: getRoster
      tags: [roster]
      summary: Recupera la rosa di una squadra fanta con voti di giornata
      parameters:
        - in: query
          name: fantaTeamId
          required: true
          schema:
            type: string
        - in: query
          name: season
          required: true
          schema:
            type: integer
        - in: query
          name: round
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista giocatori della rosa con voto di giornata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterPlayer"

  /competition/{competitionId}/matches:
    get:
      operationId: getCompetitionMatches
      tags: [matches]
      summary: Lista partite di una competizione, opzionalmente filtrate per round
      parameters:
        - in: path
          name: competitionId
          required: true
          schema:
            type: string
        - in: query
          name: round
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista match ordinata per round asc, id asc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionMatchesResponse"
        "404":
          description: Competizione non trovata

  /competition/{competitionId}/standings:
    get:
      operationId: getCompetitionStandings
      tags: [matches]
      summary: Classifica on-the-fly calcolata dai match giocati
      parameters:
        - in: path
          name: competitionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Classifica ordinata per punti, differenza reti, gol fatti, nome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingsResponse"
        "404":
          description: Competizione non trovata

  /matches/{matchId}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Singolo match per ID
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionMatch"
        "404":
          description: Match non trovato

  /matches:
    get:
      operationId: getMatches
      tags: [matches]
      summary: Recupera i match di una giornata con punteggi fanta
      parameters:
        - in: query
          name: competitionId
          schema:
            type: string
          required: true
        - in: query
          name: giornata
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Lista partite con punteggi (null se non ancora calcolati)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchInfo"
        "400":
          description: Parametri non validi

  # ─── AUCTIONS ─────────────────────────────────────────────
  /auctions:
    post:
      operationId: createAuction
      tags: [auctions]
      summary: Avvia una nuova asta live per una lega
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuctionBody"
      responses:
        "201":
          description: Asta avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAuctionResponse"
        "400":
          description: Lega non trovata o meno di 4 squadre
        "409":
          description: Asta già attiva per questa lega

  /auctions/{id}:
    get:
      operationId: getAuction
      tags: [auctions]
      summary: Stato corrente dell'asta (player corrente, offerta, storico, squadre)
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionState"
        "404":
          description: Asta non trovata

  /auctions/{id}/stream:
    get:
      operationId: getAuctionStream
      tags: [auctions]
      summary: "SSE stream — aggiornamenti real-time dello stato asta"
      description: "Server-Sent Events. Il server invia lo stato completo (AuctionState) a ogni mutazione. Il client deve riconnettersi automaticamente tramite EventSource."
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: Stream SSE
          content:
            text/event-stream:
              schema:
                type: string

  /auctions/{id}/bid:
    post:
      operationId: createAuctionBid
      tags: [auctions]
      summary: Piazza un'offerta sul player corrente
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuctionBidBody"
      responses:
        "201":
          description: Offerta registrata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAuctionBidResponse"
        "400":
          description: Validazione fallita
        "403":
          description: Asta non in corso
        "409":
          description: Offerta inferiore alla corrente

  /auctions/{id}/assign:
    post:
      operationId: assignAuction
      tags: [auctions]
      summary: Aggiudica il player corrente alla squadra con offerta più alta
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionPlayerActionBody"
      responses:
        "200":
          description: Aggiudicazione completata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionActionResponse"
        "403":
          description: Asta non in corso
        "409":
          description: Nessuna offerta valida

  /auctions/{id}/skip:
    post:
      operationId: skipAuction
      tags: [auctions]
      summary: Salta il player corrente (status=skipped)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionPlayerActionBody"
      responses:
        "200":
          description: Player saltato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionActionResponse"
        "403":
          description: Asta non in corso

  /auctions/{id}/pause:
    post:
      operationId: pauseAuction
      tags: [auctions]
      summary: Sospende l'asta
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: Asta sospesa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"

  /auctions/{id}/resume:
    post:
      operationId: resumeAuction
      tags: [auctions]
      summary: Riprende l'asta sospesa
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: Asta ripresa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"

  /auctions/{id}/end:
    post:
      operationId: endAuction
      tags: [auctions]
      summary: Termina anticipatamente l'asta
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: Asta terminata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"

  /auctions/{id}/undo:
    post:
      operationId: undoAuction
      tags: [auctions]
      summary: Annulla l'ultima azione (offerta, salto, aggiudicazione)
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: Annullo eseguito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoAuctionResponse"
        "204":
          description: Nulla da annullare
        "403":
          description: Asta non in corso o sospesa

  /auctions/{id}/call:
    post:
      operationId: callPlayer
      tags: [auctions]
      summary: "Chiama un giocatore svincolato come corrente (modalità chiamata)"
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallPlayerBody"
      responses:
        "200":
          description: Giocatore in asta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPlayerResponse"
        "400":
          description: Giocatore già assegnato o non trovato
        "403":
          description: Asta non in corso o modalità non chiamata
        "409":
          description: Giocatore già in asta o altro conflitto

  /auctions/{id}/queue:
    get:
      operationId: getAuctionQueue
      tags: [auctions]
      summary: "Lista giocatori in attesa nella coda dell'asta (pending)"
      parameters:
        - $ref: "#/components/parameters/StringId"
        - name: search
          in: query
          schema:
            type: string
          description: "Filtra per nome o squadra reale"
        - name: role
          in: query
          schema:
            type: string
            enum: [GK, DEF, MID, ATT]
          description: "Filtra per ruolo"
      responses:
        "200":
          description: Lista giocatori pendenti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionQueueResponse"
        "404":
          description: Asta non trovata

  /auctions/{id}/manual/add:
    post:
      operationId: manualAddPlayer
      tags: [auctions]
      summary: Aggiunge manualmente un giocatore alla rosa di una squadra (override banditore)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualAddBody"
      responses:
        "200":
          description: Giocatore aggiunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualChangeResponse"
        "400":
          description: Parametri non validi
        "403":
          description: Asta non in corso o sospesa

  /auctions/{id}/manual/remove:
    post:
      operationId: manualRemovePlayer
      tags: [auctions]
      summary: Rimuove manualmente un giocatore dalla rosa di una squadra (override banditore)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualRemoveBody"
      responses:
        "200":
          description: Giocatore rimosso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualChangeResponse"
        "400":
          description: Giocatore non trovato in rosa
        "403":
          description: Asta non in corso o sospesa

  /auctions/{id}/manual/set-budget:
    post:
      operationId: manualSetBudget
      tags: [auctions]
      summary: Imposta direttamente il budget di una squadra (override banditore)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualSetBudgetBody"
      responses:
        "200":
          description: Budget aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualChangeResponse"
        "400":
          description: Squadra non trovata
        "403":
          description: Asta non in corso o sospesa

  /auctions/{id}/manual/update-price:
    post:
      operationId: manualUpdatePrice
      tags: [auctions]
      summary: Modifica il prezzo di un giocatore già in rosa, riconciliando i crediti (override banditore)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualUpdatePriceBody"
      responses:
        "200":
          description: Prezzo aggiornato, crediti riconciliati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualUpdatePriceResponse"
        "400":
          description: Giocatore non in rosa o parametri non validi
        "403":
          description: Asta non in corso o sospesa

components:
  parameters:
    StringId:
      in: path
      name: id
      required: true
      schema:
        type: string
    LeagueId:
      in: path
      name: leagueId
      required: true
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── FEATURE FLAGS ────────────────────────────────────────
    FeatureFlags:
      type: object
      description: I 20 feature flag di configurazione lega (copiati dal template al momento della creazione). Chiavi aggiuntive future sono tollerate (additionalProperties).
      additionalProperties: true
      properties:
        multi_season_contracts:
          type: boolean
          description: Contratti pluriennali (>1 stagione)
        max_contract_length:
          type: integer
          description: Durata massima contratto in stagioni (1-10)
        contract_renewal:
          type: boolean
          description: Flusso esplicito di rinnovo contrattuale
        preemption_right:
          type: boolean
          description: Diritto di pareggio in asta per il detentore uscente
        repair_auction_january:
          type: boolean
          description: Asta di riparazione invernale di gennaio
        free_agent_pool:
          type: boolean
          description: Pool svincolati permanente disponibile
        direct_trades:
          type: boolean
          description: Scambi diretti 1-a-1 tra manager
        always_on_markets:
          type: boolean
          description: Mercati e scambi sempre attivi in stagione
        carryover_budget:
          type: boolean
          description: Budget residuo portato alla stagione successiva
        carryover_percentage:
          type: number
          description: Percentuale di budget residuo mantenuta (0-100)
        player_value_dynamic:
          type: boolean
          description: Valore di mercato del giocatore aggiornato dinamicamente
        amortization:
          type: boolean
          description: Ammortamento del prezzo d'acquisto sugli anni di contratto
        release_clauses:
          type: boolean
          description: Clausole rescissorie attive
        clause_default_factor:
          type: number
          description: Moltiplicatore residuo per clausola di default (0.5-1.0)
        rescission_penalty:
          type: boolean
          description: Penale se il manager svincola prima della scadenza
        rescission_recovery_pct:
          type: number
          description: Percentuale crediti recuperata sullo svincolo (0-100)
        auction_role_cap:
          type: boolean
          description: Blocca offerta su ruolo già esaurito nella rosa della squadra offerente
        auction_reserve_budget:
          type: boolean
          description: Blocca offerta se lascerebbe meno di 1 FM per ogni slot ancora vuoto
        no_schema_tactics:
          type: boolean
          description: Formazione senza vincoli di modulo predefinito
        scouting_enabled:
          type: boolean
          description: Sistema di scouting giocatori giovani/emergenti

    # ─── MARKET EVENT SUGGESTION (nel template) ───────────────
    MarketEventSuggestion:
      type: object
      required: [name, type, description]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [auction, trade, release, free_agent]
        mode:
          type: string
          enum: [live, async, blind, token, open]
        window_hint:
          type: string
        description:
          type: string

    # ─── COMPETITION SUGGESTION (nel template) ────────────────
    CompetitionSuggestion:
      type: object
      required: [name, type, description]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [campionato, coppa, battle_royale, sprint_race, formula_uno, punteggio_assoluto]
        description:
          type: string

    # ─── TEMPLATE PROFILE ─────────────────────────────────────
    TemplateProfile:
      type: object
      required: [id, name, tagline, description, complexity_level, estimated_weekly_minutes, icon, feature_flags, suggested_markets, suggested_competitions, is_system, is_active, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        tagline:
          type: string
        description:
          type: string
        complexity_level:
          type: integer
          description: "1 = base, 2 = intermedio, 3 = avanzato"
        estimated_weekly_minutes:
          type: integer
          description: Tempo stimato di gestione settimanale in minuti
        icon:
          type: string
        feature_flags:
          $ref: "#/components/schemas/FeatureFlags"
        suggested_markets:
          type: array
          items:
            $ref: "#/components/schemas/MarketEventSuggestion"
        suggested_competitions:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionSuggestion"
        author_user_id:
          type: ["string", "null"]
        is_system:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TemplateInput:
      type: object
      required: [name, complexity_level, estimated_weekly_minutes, feature_flags]
      properties:
        name:
          type: string
        tagline:
          type: string
        description:
          type: string
        complexity_level:
          type: integer
        estimated_weekly_minutes:
          type: integer
        icon:
          type: string
        feature_flags:
          $ref: "#/components/schemas/FeatureFlags"
        suggested_markets:
          type: array
          items:
            $ref: "#/components/schemas/MarketEventSuggestion"
        suggested_competitions:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionSuggestion"
        is_active:
          type: boolean

    TemplateUpdate:
      type: object
      properties:
        name:
          type: string
        tagline:
          type: string
        description:
          type: string
        complexity_level:
          type: integer
        estimated_weekly_minutes:
          type: integer
        icon:
          type: string
        feature_flags:
          $ref: "#/components/schemas/FeatureFlags"
        suggested_markets:
          type: array
          items:
            $ref: "#/components/schemas/MarketEventSuggestion"
        suggested_competitions:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionSuggestion"
        is_active:
          type: boolean

    # ─── LEAGUE ───────────────────────────────────────────────
    League:
      type: object
      required: [id, name, federation_id, admin_user_id, max_managers, season, visibility, started, timer_seconds, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        federation_id:
          type: string
          description: ID federazione (sempre presente — creata automaticamente al setup)
        template_id:
          type: ["string", "null"]
        admin_user_id:
          type: string
        co_admin_user_ids:
          type: array
          items:
            type: string
        max_managers:
          type: integer
        season:
          type: integer
        visibility:
          type: string
          enum: [private, public, unlisted]
        invitation_code:
          type: ["string", "null"]
        lineup_visibility:
          type: string
          enum: [always, after_deadline, hidden_all_season]
        roster_visibility:
          type: string
          enum: [always, after_deadline, hidden_all_season]
        started:
          type: boolean
        notify_email:
          type: boolean
        notify_push:
          type: boolean
        timer_seconds:
          type: integer
          description: Secondi per ogni round d'asta (default 8)
        budget_initial:
          type: ["integer", "null"]
          description: Budget iniziale per squadra in FM
        roster_p:
          type: ["integer", "null"]
          description: Portieri per squadra
        roster_d:
          type: ["integer", "null"]
          description: Difensori per squadra
        roster_c:
          type: ["integer", "null"]
          description: Centrocampisti per squadra
        roster_a:
          type: ["integer", "null"]
          description: Attaccanti per squadra
        auction_mode:
          type: ["string", "null"]
          enum: [classico, manageriale, manageriale_pro, null]
          description: Modalità asta
        post_acquisition_window:
          $ref: "#/components/schemas/PostAcquisitionWindow"
          description: Finestra temporale post-acquisto
        snapshot_locked_at:
          type: ["string", "null"]
          format: date-time
          description: Timestamp del freeze delle regole federazione (null = non ancora avvenuto)
        snapshot_rules:
          allOf:
            - $ref: "#/components/schemas/FederationRules"
          nullable: true
          description: Snapshot delle regole di punteggio congelate alla prima asta (null = non ancora avvenuto)
        created_at:
          type: string
          format: date-time

    LeagueInput:
      type: object
      required: [name, budget_initial, timer_seconds, roster_p, roster_d, roster_c, roster_a, team_count]
      properties:
        name:
          type: string
          maxLength: 50
        budget_initial:
          type: integer
          minimum: 100
          maximum: 2000
        timer_seconds:
          type: integer
          minimum: 3
          maximum: 30
        roster_p:
          type: integer
          minimum: 1
          maximum: 15
        roster_d:
          type: integer
          minimum: 1
          maximum: 15
        roster_c:
          type: integer
          minimum: 1
          maximum: 15
        roster_a:
          type: integer
          minimum: 1
          maximum: 15
        federation_id:
          type: string
          description: Se fornito, la lega adotta questa federazione esistente anziché crearne una nuova automaticamente.
          nullable: true
        team_count:
          type: integer
          minimum: 4
          maximum: 20
