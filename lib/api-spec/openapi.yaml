        league_id:
          type: string
        status:
          type: string
          enum: [setup, running, paused, completed, cancelled]
        timer_seconds:
          type: integer
          minimum: 5
          maximum: 30
          default: 8
        roster_p:
          type: integer
          minimum: 1
          default: 3
        roster_d:
          type: integer
          minimum: 1
          default: 8
        roster_c:
          type: integer
          minimum: 1
          default: 8
        roster_a:
          type: integer
          minimum: 1
          default: 6
        undoable:
          type: boolean
          description: "Vero se esiste un'azione annullabile (bid/skip/assign). Server-authoritative."
        call_mode:
          type: string
          enum: [listone, chiamata]
          default: listone
          description: "Modalità di avanzamento: sequenziale (listone) o a chiamata esplicita (chiamata)"
        role_order:
          type: boolean
          default: false
          description: "In chiamata: ordina per ruolo P→D→C→A"
        deadline_ts:
          type: ["integer", "null"]
          description: "Epoch ms della deadline del rilancio corrente. Null se nessun timer attivo. Server-authoritative."
        paused_remaining_ms:
          type: integer
          default: 0
          description: "Ms residui del timer al momento della pausa. Usati da /resume per ripristinare la deadline."
        started_at:
          type: ["string", "null"]
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time
