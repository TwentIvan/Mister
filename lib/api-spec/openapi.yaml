openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mister — il fantacalcio manageriale
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: templates
    description: Template profili (Classico/Esploratore/Manageriale)
  - name: leagues
    description: Leghe fantacalcio
  - name: federations
    description: Regolamenti e feature flags delle leghe
  - name: competitions
    description: Competizioni dentro una lega
  - name: markets
    description: Eventi di mercato
  - name: teams
    description: Squadre fantacalcio dei manager
  - name: players
    description: Giocatori Serie A
  - name: contracts
    description: Contratti pluriennali
  - name: lineups
    description: Formazioni giornata
  - name: matches
    description: Partite con punteggi fanta
  - name: auctions
    description: Aste live

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── TEMPLATES ───────────────────────────────────────────────
  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: Lista template attivi
      parameters:
        - in: query
          name: active_only
          schema:
            type: boolean
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateProfile"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Dettaglio template
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateProfile"
        "404":
          description: Not found

  /superadmin/templates:
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Crea nuovo template (superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateProfile"

  /superadmin/templates/{id}:
    patch:
      operationId: updateTemplate
      tags: [templates]
      summary: Aggiorna template (superadmin)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateProfile"
        "404":
          description: Not found
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Elimina template custom (superadmin — solo non-system)
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Template di sistema non eliminabile
        "404":
          description: Not found

  # ─── LEAGUES ─────────────────────────────────────────────────
  /leagues:
    get:
      operationId: listLeagues
      tags: [leagues]
      summary: Lista leghe
      parameters:
        - in: query
          name: admin_user_id
          schema:
            type: string
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
    post:
      operationId: createLeague
      tags: [leagues]
      summary: Crea una lega con wizard (nome, parametri asta, squadre)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueWizardResponse"
        "400":
          description: Validation error
        "409":
          description: Nomi all'asta duplicati

  /leagues/{id}:
    get:
      operationId: getLeague
      tags: [leagues]
      summary: Dettaglio lega
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          description: Not found
    patch:
      operationId: updateLeague
      tags: [leagues]
      summary: Aggiorna lega
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          description: Not found
    delete:
      operationId: deleteLeague
      tags: [leagues]
      summary: Elimina lega
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "204":
          description: Deleted

  /leagues/{id}/stats:
    get:
      operationId: getLeagueStats
      tags: [leagues]
      summary: Statistiche aggregate della lega
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueStats"
        "404":
          description: Not found

  # ─── FEDERATIONS ─────────────────────────────────────────────
  /leagues/{leagueId}/federation:
    get:
      operationId: getFederation
      tags: [federations]
      summary: Regolamento della lega
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Federation"
        "404":
          description: Not found
    patch:
      operationId: updateFederation
      tags: [federations]
      summary: Aggiorna regolamento (admin lega)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FederationUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Federation"
        "404":
          description: Not found

  # ─── COMPETITIONS ─────────────────────────────────────────────
  /leagues/{leagueId}/competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      summary: Lista competizioni della lega
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"
    post:
      operationId: createCompetition
      tags: [competitions]
      summary: Crea competizione
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /leagues/{leagueId}/competitions/{id}:
    get:
      operationId: getCompetition
      tags: [competitions]
      summary: Dettaglio competizione
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"
        "404":
          description: Not found
    patch:
      operationId: updateCompetition
      tags: [competitions]
      summary: Aggiorna competizione
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"
        "404":
          description: Not found
    delete:
      operationId: deleteCompetition
      tags: [competitions]
      summary: Elimina competizione
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "204":
          description: Deleted

  # ─── MARKETS ─────────────────────────────────────────────────
  /leagues/{leagueId}/markets:
    get:
      operationId: getLeagueMarkets
      tags: [markets]
      summary: Lista eventi di mercato
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketEvent"
    post:
      operationId: createMarketEvent
      tags: [markets]
      summary: Crea evento di mercato
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEvent"

  /leagues/{leagueId}/markets/{id}:
    get:
      operationId: getMarketEvent
      tags: [markets]
      summary: Dettaglio evento mercato
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEvent"
        "404":
          description: Not found
    patch:
      operationId: updateMarketEvent
      tags: [markets]
      summary: Aggiorna evento mercato
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketEventUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEvent"
        "404":
          description: Not found
    delete:
      operationId: deleteMarketEvent
      tags: [markets]
      summary: Elimina evento mercato
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "204":
          description: Deleted

  # ─── FANTA TEAMS ─────────────────────────────────────────────
  /leagues/{leagueId}/teams:
    get:
      operationId: listFantaTeams
      tags: [teams]
      summary: Lista squadre della lega
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FantaTeam"
    post:
      operationId: createFantaTeam
      tags: [teams]
      summary: Crea squadra
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FantaTeamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FantaTeam"

  /leagues/{leagueId}/teams/{id}:
    get:
      operationId: getFantaTeam
      tags: [teams]
      summary: Dettaglio squadra
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FantaTeam"
        "404":
          description: Not found
    patch:
      operationId: updateFantaTeam
      tags: [teams]
      summary: Aggiorna squadra
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FantaTeamUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FantaTeam"
        "404":
          description: Not found

  # ─── PLAYERS ─────────────────────────────────────────────────
  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: Lista giocatori Serie A
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [GK, DEF, MID, ATT]
          required: false
        - in: query
          name: team
          schema:
            type: string
          required: false
        - in: query
          name: search
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          required: false
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerList"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Dettaglio giocatore
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found

  # ─── CONTRACTS ───────────────────────────────────────────────
  /leagues/{leagueId}/contracts:
    get:
      operationId: getLeagueContracts
      tags: [contracts]
      summary: Lista contratti della lega
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Crea contratto (post-asta)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /leagues/{leagueId}/contracts/{id}:
    get:
      operationId: getContract
      tags: [contracts]
      summary: Dettaglio contratto
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "404":
          description: Not found
    patch:
      operationId: updateContract
      tags: [contracts]
      summary: Aggiorna stato contratto (rescissione, clausola pagata, ecc.)
      parameters:
        - $ref: "#/components/parameters/LeagueId"
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "404":
          description: Not found

  # ─── DASHBOARD (wow endpoint) ─────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [leagues]
      summary: Riepilogo globale per un utente (leghe, competizioni attive, mercati aperti)
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ─── VOTO ALGORITHM CONFIG ────────────────────────────────
  /voto-algorithm-configs:
    get:
      operationId: listVotoAlgorithmConfigs
      tags: [superadmin]
      summary: Elenco configurazioni algoritmo voto
      parameters:
        - name: federationId
          in: query
          schema:
            type: string
            nullable: true
          description: Se omesso, ritorna tutte. Stringa speciale 'null' per filtrare solo system default. Altrimenti ID federazione.
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/VotoAlgorithmConfigStatus"
      responses:
        "200":
          description: Lista config, ordinate per createdAt desc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VotoAlgorithmConfig"
    post:
      operationId: createVotoAlgorithmConfig
      tags: [superadmin]
      summary: Crea una nuova configurazione algoritmo voto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VotoAlgorithmConfigCreate"
      responses:
        "201":
          description: Config creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotoAlgorithmConfig"
        "409":
          description: Vincolo unique violato (status=active già presente per la federazione)

  /voto-algorithm-configs/{id}:
    patch:
      operationId: updateVotoAlgorithmConfig
      tags: [superadmin]
      summary: Modifica parziale di una configurazione algoritmo voto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VotoAlgorithmConfigUpdate"
      responses:
        "200":
          description: Config aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotoAlgorithmConfig"
        "403":
          description: Operazione bloccata (es. tentativo di archiviare riga is_protected)
        "404":
          description: Config non trovata

  /voto-algorithm-configs/recalculate:
    post:
      operationId: recalculateVotoMister
      tags: [superadmin]
      summary: Ricalcola voto_mister su tutti i player_giornata_stats
      description: Usa la config attiva del federation_id specificato (o system default se omesso). Operazione sincrona, ~1s per 600 record.
      parameters:
        - name: federationId
          in: query
          schema:
            type: string
            nullable: true
      responses:
        "200":
          description: Ricalcolo completato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotoAlgorithmRecalculateResponse"
        "404":
          description: Nessuna config attiva trovata

  # ─── LINEUPS ─────────────────────────────────────────────
  /lineups:
    get:
      operationId: getLineups
      tags: [lineups]
      summary: Recupera la formazione di una squadra per una giornata
      parameters:
        - in: query
          name: fantaTeamId
          schema:
            type: string
          required: true
        - in: query
          name: season
          schema:
            type: integer
          required: true
        - in: query
          name: round
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Lineup trovato, o null se non ancora compilato
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Lineup"
                  - type: "null"
    put:
      operationId: putLineup
      tags: [lineups]
      summary: Crea o aggiorna la formazione (upsert)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupInput"
      responses:
        "200":
          description: Lineup salvato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lineup"
        "400":
          description: Payload non valido (errori di validazione)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
        "403":
          description: Lineup bloccato — deadline passata

  /roster:
    get:
      operationId: getRoster
      tags: [roster]
      summary: Recupera la rosa di una squadra fanta con voti di giornata
      parameters:
        - in: query
          name: fantaTeamId
          required: true
          schema:
            type: string
        - in: query
          name: season
          required: true
          schema:
            type: integer
        - in: query
          name: round
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista giocatori della rosa con voto di giornata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterPlayer"

  /competition/{competitionId}/matches:
    get:
      operationId: getCompetitionMatches
      tags: [matches]
      summary: Lista partite di una competizione, opzionalmente filtrate per round
      parameters:
        - in: path
          name: competitionId
          required: true
          schema:
            type: string
        - in: query
          name: round
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista match ordinata per round asc, id asc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionMatchesResponse"
        "404":
          description: Competizione non trovata

  /competition/{competitionId}/standings:
    get:
      operationId: getCompetitionStandings
      tags: [matches]
      summary: Classifica on-the-fly calcolata dai match giocati
      parameters:
        - in: path
          name: competitionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Classifica ordinata per punti, differenza reti, gol fatti, nome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingsResponse"
        "404":
          description: Competizione non trovata

  /matches/{matchId}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Singolo match per ID
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionMatch"
        "404":
          description: Match non trovato

  /matches:
    get:
      operationId: getMatches
      tags: [matches]
      summary: Recupera i match di una giornata con punteggi fanta
      parameters:
        - in: query
          name: competitionId
          schema:
            type: string
          required: true
        - in: query
          name: giornata
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Lista partite con punteggi (null se non ancora calcolati)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchInfo"
        "400":
          description: Parametri non validi

  # ─── AUCTIONS ─────────────────────────────────────────────
  /auctions:
    post:
      operationId: createAuction
      tags: [auctions]
      summary: Avvia una nuova asta live per una lega
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuctionBody"
      responses:
        "201":
          description: Asta avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAuctionResponse"
        "400":
          description: Lega non trovata o meno di 4 squadre
        "409":
          description: Asta già attiva per questa lega

  /auctions/{id}:
    get:
      operationId: getAuction
      tags: [auctions]
      summary: Stato corrente dell'asta (player corrente, offerta, storico, squadre)
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionState"
        "404":
          description: Asta non trovata

  /auctions/{id}/bid:
    post:
      operationId: createAuctionBid
      tags: [auctions]
      summary: Piazza un'offerta sul player corrente
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuctionBidBody"
      responses:
        "201":
          description: Offerta registrata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAuctionBidResponse"
        "400":
          description: Validazione fallita
        "403":
          description: Asta non in corso
        "409":
          description: Offerta inferiore alla corrente

  /auctions/{id}/assign:
    post:
      operationId: assignAuction
      tags: [auctions]
      summary: Aggiudica il player corrente alla squadra con offerta più alta
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionPlayerActionBody"
      responses:
        "200":
          description: Aggiudicazione completata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionActionResponse"
        "403":
          description: Asta non in corso
        "409":
          description: Nessuna offerta valida

  /auctions/{id}/skip:
    post:
      operationId: skipAuction
      tags: [auctions]
      summary: Salta il player corrente (status=skipped)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionPlayerActionBody"
      responses:
        "200":
          description: Player saltato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionActionResponse"
        "403":
          description: Asta non in corso

  /auctions/{id}/pause:
    post:
      operationId: pauseAuction
      tags: [auctions]
      summary: Sospende l'asta
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: Asta sospesa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"

  /auctions/{id}/resume:
    post:
      operationId: resumeAuction
      tags: [auctions]
      summary: Riprende l'asta sospesa
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: Asta ripresa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"

  /auctions/{id}/end:
    post:
      operationId: endAuction
      tags: [auctions]
      summary: Termina anticipatamente l'asta
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: Asta terminata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"

  /auctions/{id}/undo:
    post:
      operationId: undoAuction
      tags: [auctions]
      summary: Annulla l'ultima azione (offerta, salto, aggiudicazione)
      parameters:
        - $ref: "#/components/parameters/StringId"
      responses:
        "200":
          description: Annullo eseguito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoAuctionResponse"
        "204":
          description: Nulla da annullare
        "403":
          description: Asta non in corso o sospesa

  /auctions/{id}/call:
    post:
      operationId: callPlayer
      tags: [auctions]
      summary: "Chiama un giocatore svincolato come corrente (modalità chiamata)"
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallPlayerBody"
      responses:
        "200":
          description: Giocatore in asta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPlayerResponse"
        "400":
          description: Giocatore già assegnato o non trovato
        "403":
          description: Asta non in corso o modalità non chiamata
        "409":
          description: Giocatore già in asta o altro conflitto

  /auctions/{id}/manual/add:
    post:
      operationId: manualAddPlayer
      tags: [auctions]
      summary: Aggiunge manualmente un giocatore alla rosa di una squadra (override banditore)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualAddBody"
      responses:
        "200":
          description: Giocatore aggiunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualChangeResponse"
        "400":
          description: Parametri non validi
        "403":
          description: Asta non in corso o sospesa

  /auctions/{id}/manual/remove:
    post:
      operationId: manualRemovePlayer
      tags: [auctions]
      summary: Rimuove manualmente un giocatore dalla rosa di una squadra (override banditore)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualRemoveBody"
      responses:
        "200":
          description: Giocatore rimosso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualChangeResponse"
        "400":
          description: Giocatore non trovato in rosa
        "403":
          description: Asta non in corso o sospesa

  /auctions/{id}/manual/set-budget:
    post:
      operationId: manualSetBudget
      tags: [auctions]
      summary: Imposta direttamente il budget di una squadra (override banditore)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualSetBudgetBody"
      responses:
        "200":
          description: Budget aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualChangeResponse"
        "400":
          description: Squadra non trovata
        "403":
          description: Asta non in corso o sospesa

  /auctions/{id}/manual/update-price:
    post:
      operationId: manualUpdatePrice
      tags: [auctions]
      summary: Modifica il prezzo di un giocatore già in rosa, riconciliando i crediti (override banditore)
      parameters:
        - $ref: "#/components/parameters/StringId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualUpdatePriceBody"
      responses:
        "200":
          description: Prezzo aggiornato, crediti riconciliati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualUpdatePriceResponse"
        "400":
          description: Giocatore non in rosa o parametri non validi
        "403":
          description: Asta non in corso o sospesa

components:
  parameters:
    StringId:
      in: path
      name: id
      required: true
      schema:
        type: string
    LeagueId:
      in: path
      name: leagueId
      required: true
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── FEATURE FLAGS ────────────────────────────────────────
    FeatureFlags:
      type: object
      description: I 18 feature flag copiati dal template al momento della creazione della lega
      properties:
        multi_season_contracts:
          type: boolean
          description: Contratti pluriennali (>1 stagione)
        max_contract_length:
          type: integer
          description: Durata massima contratto in stagioni (1-10)
        contract_renewal:
          type: boolean
          description: Flusso esplicito di rinnovo contrattuale
        preemption_right:
          type: boolean
          description: Diritto di pareggio in asta per il detentore uscente
        repair_auction_january:
          type: boolean
          description: Asta di riparazione invernale di gennaio
        free_agent_pool:
          type: boolean
          description: Pool svincolati permanente disponibile
        direct_trades:
          type: boolean
          description: Scambi diretti 1-a-1 tra manager
        always_on_markets:
          type: boolean
          description: Mercati e scambi sempre attivi in stagione
        carryover_budget:
          type: boolean
          description: Budget residuo portato alla stagione successiva
        carryover_percentage:
          type: number
          description: Percentuale di budget residuo mantenuta (0-100)
        player_value_dynamic:
          type: boolean
          description: Valore di mercato del giocatore aggiornato dinamicamente
        amortization:
          type: boolean
          description: Ammortamento del prezzo d'acquisto sugli anni di contratto
        release_clauses:
          type: boolean
          description: Clausole rescissorie attive
        clause_default_factor:
          type: number
          description: Moltiplicatore residuo per clausola di default (0.5-1.0)
        rescission_penalty:
          type: boolean
          description: Penale se il manager svincola prima della scadenza
        rescission_recovery_pct:
          type: number
          description: Percentuale crediti recuperata sullo svincolo (0-100)
        no_schema_tactics:
          type: boolean
          description: Formazione senza vincoli di modulo predefinito
        scouting_enabled:
          type: boolean
          description: Sistema di scouting giocatori giovani/emergenti

    # ─── MARKET EVENT SUGGESTION (nel template) ───────────────
    MarketEventSuggestion:
      type: object
      required: [name, type, description]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [auction, trade, release, free_agent]
        mode:
          type: string
          enum: [live, async, blind, token, open]
        window_hint:
          type: string
        description:
          type: string

    # ─── COMPETITION SUGGESTION (nel template) ────────────────
    CompetitionSuggestion:
      type: object
      required: [name, type, description]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [campionato, coppa, battle_royale, sprint_race, formula_uno, punteggio_assoluto]
        description:
          type: string

    # ─── TEMPLATE PROFILE ─────────────────────────────────────
    TemplateProfile:
      type: object
      required: [id, name, tagline, description, complexity_level, estimated_weekly_minutes, icon, feature_flags, suggested_markets, suggested_competitions, is_system, is_active, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        tagline:
          type: string
        description:
          type: string
        complexity_level:
          type: integer
          description: "1 = base, 2 = intermedio, 3 = avanzato"
        estimated_weekly_minutes:
          type: integer
          description: Tempo stimato di gestione settimanale in minuti
        icon:
          type: string
        feature_flags:
          $ref: "#/components/schemas/FeatureFlags"
        suggested_markets:
          type: array
          items:
            $ref: "#/components/schemas/MarketEventSuggestion"
        suggested_competitions:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionSuggestion"
        author_user_id:
          type: ["string", "null"]
        is_system:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TemplateInput:
      type: object
      required: [name, complexity_level, estimated_weekly_minutes, feature_flags]
      properties:
        name:
          type: string
        tagline:
          type: string
        description:
          type: string
        complexity_level:
          type: integer
        estimated_weekly_minutes:
          type: integer
        icon:
          type: string
        feature_flags:
          $ref: "#/components/schemas/FeatureFlags"
        suggested_markets:
          type: array
          items:
            $ref: "#/components/schemas/MarketEventSuggestion"
        suggested_competitions:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionSuggestion"
        is_active:
          type: boolean

    TemplateUpdate:
      type: object
      properties:
        name:
          type: string
        tagline:
          type: string
        description:
          type: string
        complexity_level:
          type: integer
        estimated_weekly_minutes:
          type: integer
        icon:
          type: string
        feature_flags:
          $ref: "#/components/schemas/FeatureFlags"
        suggested_markets:
          type: array
          items:
            $ref: "#/components/schemas/MarketEventSuggestion"
        suggested_competitions:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionSuggestion"
        is_active:
          type: boolean

    # ─── LEAGUE ───────────────────────────────────────────────
    League:
      type: object
      required: [id, name, admin_user_id, max_managers, season, visibility, started, timer_seconds, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        federation_id:
          type: ["string", "null"]
        template_id:
          type: ["string", "null"]
        admin_user_id:
          type: string
        co_admin_user_ids:
          type: array
          items:
            type: string
        max_managers:
          type: integer
        season:
          type: integer
        visibility:
          type: string
          enum: [private, public, unlisted]
        invitation_code:
          type: ["string", "null"]
        lineup_visibility:
          type: string
          enum: [always, after_deadline, hidden_all_season]
        roster_visibility:
          type: string
          enum: [always, after_deadline, hidden_all_season]
        started:
          type: boolean
        notify_email:
          type: boolean
        notify_push:
          type: boolean
        timer_seconds:
          type: integer
          description: Secondi per ogni round d'asta (default 8)
        budget_initial:
          type: ["integer", "null"]
          description: Budget iniziale per squadra in FM
        roster_p:
          type: ["integer", "null"]
          description: Portieri per squadra
        roster_d:
          type: ["integer", "null"]
          description: Difensori per squadra
        roster_c:
          type: ["integer", "null"]
          description: Centrocampisti per squadra
        roster_a:
          type: ["integer", "null"]
          description: Attaccanti per squadra
        auction_mode:
          type: ["string", "null"]
          enum: [classico, manageriale, manageriale_pro, null]
          description: Modalità asta
        created_at:
          type: string
          format: date-time

    LeagueInput:
      type: object
      required: [name, budget_initial, timer_seconds, roster_p, roster_d, roster_c, roster_a, fanta_teams]
      properties:
        name:
          type: string
          maxLength: 50
        budget_initial:
          type: integer
          minimum: 100
          maximum: 2000
        timer_seconds:
          type: integer
          minimum: 3
          maximum: 30
        roster_p:
          type: integer
          minimum: 1
          maximum: 15
        roster_d:
          type: integer
          minimum: 1
          maximum: 15
        roster_c:
          type: integer
          minimum: 1
          maximum: 15
        roster_a:
          type: integer
          minimum: 1
          maximum: 15
        fanta_teams:
          type: array
          items:
            $ref: "#/components/schemas/FantaTeamWizardInput"
          minItems: 4
          maxItems: 8

    FantaTeamWizardInput:
      type: object
      required: [name, name_auction, color_primary, color_secondary]
      properties:
        name:
          type: string
          maxLength: 50
        name_auction:
          type: string
          maxLength: 30
          description: Nome pronunciato dal battitore in asta
        color_primary:
          type: string
          example: "#1f4733"
        color_secondary:
          type: string
          example: "#efe6d3"
        logo_url:
          type: ["string", "null"]

    LeagueWizardResponse:
      type: object
      required: [league, fanta_teams]
      properties:
        league:
          $ref: "#/components/schemas/League"
        fanta_teams:
          type: array
          items:
            $ref: "#/components/schemas/FantaTeam"

    LeagueUpdate:
      type: object
      properties:
        name:
          type: string
        max_managers:
          type: integer
        visibility:
          type: string
          enum: [private, public, unlisted]
        lineup_visibility:
          type: string
          enum: [always, after_deadline, hidden_all_season]
        roster_visibility:
          type: string
          enum: [always, after_deadline, hidden_all_season]
        started:
          type: boolean
        notify_email:
          type: boolean
        notify_push:
          type: boolean

    LeagueStats:
      type: object
      required: [league_id, team_count, competition_count, active_market_count, contract_count]
      properties:
        league_id:
          type: string
        team_count:
          type: integer
        competition_count:
          type: integer
        active_market_count:
          type: integer
        contract_count:
          type: integer

    # ─── FEDERATION RULES ─────────────────────────────────────
    FederationRules:
      type: object
      description: Regole di calcolo del punteggio fanta (bonus/malus, soglie, modificatori)
      properties:
        bonusMalus:
          type: object
          description: Bonus e malus per evento (gol, assist, ammonizioni, ecc.)
        goalThresholds:
          type: object
          description: Conversione punteggio squadra in fanta-gol
        defenseModifier:
          type: object
          description: Modificatore difesa
        midfieldModifier:
          type: object
          description: Modificatore centrocampo
        homeAdvantage:
          type: object
          description: Bonus padrone di casa
        substitutions:
          type: object
          description: Regole sostituzioni automatiche

    # ─── FEDERATION ───────────────────────────────────────────
    Federation:
      type: object
      required: [id, name, mode, feature_flags, rules, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        template_id:
          type: ["string", "null"]
        mode:
          type: string
          enum: [classic, mantra]
        feature_flags:
          $ref: "#/components/schemas/FeatureFlags"
        rules:
          $ref: "#/components/schemas/FederationRules"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FederationUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        mode:
          type: string
          enum: [classic, mantra]
        feature_flags:
          $ref: "#/components/schemas/FeatureFlags"
        rules:
          $ref: "#/components/schemas/FederationRules"

    # ─── COMPETITION ──────────────────────────────────────────
    Competition:
      type: object
      required: [id, league_id, name, type, season, start_giornata, end_giornata, config, active, completed, created_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [campionato, coppa, battle_royale, sprint_race, formula_uno, punteggio_assoluto]
        season:
          type: integer
        start_giornata:
          type: integer
        end_giornata:
          type: integer
        config:
          type: object
          description: Configurazione specifica per tipo + tiebreaker + premi + partecipanti
        active:
          type: boolean
        completed:
          type: boolean
        starts_at:
          type: ["string", "null"]
          format: date-time
        ends_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    CompetitionInput:
      type: object
      required: [name, type, season, start_giornata, end_giornata]
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [campionato, coppa, battle_royale, sprint_race, formula_uno, punteggio_assoluto]
        season:
          type: integer
        start_giornata:
          type: integer
        end_giornata:
          type: integer
        participant_team_ids:
          type: array
          items:
            type: string
        tiebreakers:
          type: array
          items:
            type: string
        settings:
          type: object

    CompetitionUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        start_giornata:
          type: integer
        end_giornata:
          type: integer
        settings:
          type: object
        active:
          type: boolean
        completed:
          type: boolean

    # ─── MARKET EVENT ─────────────────────────────────────────
    MarketEvent:
      type: object
      required: [id, league_id, name, type, status, starts_at, ends_at, config, created_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [auction, trade, release, free_agent]
          description: "auction = asta (sub-mode in config), trade = scambi, release = svincoli, free_agent = pool svincolati"
        status:
          type: string
          enum: [scheduled, active, completed, cancelled]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        config:
          type: object
          description: "Configurazione specifica per tipo: AuctionRules / TradeRules / ReleaseRules / FreeAgentRules + labelColor"
        created_at:
          type: string
          format: date-time

    MarketEventInput:
      type: object
      required: [name, type, window_starts_at, window_ends_at]
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [auction, trade, release, free_agent]
        window_starts_at:
          type: string
          format: date-time
        window_ends_at:
          type: string
          format: date-time
        settings:
          type: object
        label_color:
          type: string

    MarketEventUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [scheduled, active, completed, cancelled]
        window_starts_at:
          type: string
          format: date-time
        window_ends_at:
          type: string
          format: date-time
        settings:
          type: object

    # ─── FANTA TEAM ───────────────────────────────────────────
    FantaTeam:
      type: object
      required: [id, league_id, manager_user_id, name, credits_remaining, created_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        manager_user_id:
          type: string
        name:
          type: string
        name_auction:
          type: ["string", "null"]
        logo_url:
          type: ["string", "null"]
        color_primary:
          type: ["string", "null"]
          description: Colore primario della maglia (da jersey.primaryColor)
        color_secondary:
          type: ["string", "null"]
          description: Colore secondario della maglia (da jersey.secondaryColor)
        credits_remaining:
          type: integer
        roster:
          type: array
          items:
            type: integer
        created_at:
          type: string
          format: date-time

    FantaTeamInput:
      type: object
      required: [manager_user_id, name]
      properties:
        manager_user_id:
          type: string
        name:
          type: string
        name_auction:
          type: string
        logo_url:
          type: string
        color_primary:
          type: string
        color_secondary:
          type: string

    FantaTeamUpdate:
      type: object
      properties:
        name:
          type: string
        name_auction:
          type: string
        logo_url:
          type: string
        credits_remaining:
          type: integer
        roster:
          type: array
          items:
            type: integer

    # ─── PLAYER ───────────────────────────────────────────────
    Player:
      type: object
      required: [id, name, full_name, real_team, role_classic]
      properties:
        id:
          type: integer
        name:
          type: string
        full_name:
          type: string
        real_team:
          type: string
        birth_date:
          type: ["string", "null"]
        nationality:
          type: ["string", "null"]
        height_cm:
          type: ["integer", "null"]
        weight_kg:
          type: ["integer", "null"]
        foot:
          type: ["string", "null"]
          enum: [left, right, both, null]
        role_classic:
          type: string
          enum: [GK, DEF, MID, ATT]
        roles_mantra:
          type: array
          items:
            type: string
        injured:
          type: boolean
        photo_url:
          type: ["string", "null"]

    PlayerList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        total:
          type: integer

    # ─── CONTRACT ─────────────────────────────────────────────
    Contract:
      type: object
      required: [id, league_id, fanta_team_id, player_id, season_start, duration_seasons, purchase_price, clause_default, clause_investment, state, created_at]
      properties:
        id:
          type: string
        league_id:
          type: string
        fanta_team_id:
          type: string
        player_id:
          type: integer
        season_start:
          type: integer
        duration_seasons:
          type: integer
        purchase_price:
          type: integer
        clause_default:
          type: integer
        clause_investment:
          type: integer
        state:
          type: string
          enum: [active, expired, rescinded, clause_paid, traded]
        notes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        closed_at:
          type: ["string", "null"]
          format: date-time

    ContractInput:
      type: object
      required: [fanta_team_id, player_id, season_start, duration_seasons, purchase_price, clause_default]
      properties:
        fanta_team_id:
          type: string
        player_id:
          type: integer
        season_start:
          type: integer
        duration_seasons:
          type: integer
        purchase_price:
          type: integer
        clause_default:
          type: integer
        clause_investment:
          type: integer

    ContractUpdate:
      type: object
      properties:
        state:
          type: string
          enum: [active, expired, rescinded, clause_paid, traded]
        clause_investment:
          type: integer
        notes:
          type: array
          items:
            type: string
        closed_at:
          type: string
          format: date-time

    # ─── DASHBOARD ────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [my_leagues, active_markets, recent_competitions]
      properties:
        my_leagues:
          type: array
          items:
            $ref: "#/components/schemas/League"
        active_markets:
          type: array
          items:
            $ref: "#/components/schemas/MarketEvent"
        recent_competitions:
          type: array
          items:
            $ref: "#/components/schemas/Competition"
        template_count:
          type: integer
        total_league_count:
          type: integer

    # ─── VOTO ALGORITHM CONFIG ─────────────────────────────────
    VotoAlgorithmConfigStatus:
      type: string
      enum: [draft, active, archived]

    VotoMisterConfigPayload:
      type: object
      description: Struttura JSON dei parametri algoritmo voto Mister. Forma libera per supportare evoluzioni future senza migration.
      additionalProperties: true

    VotoAlgorithmConfig:
      type: object
      required: [id, version, configJson, status, isProtected, createdAt]
      properties:
        id:
          type: integer
        federationId:
          type: string
          nullable: true
          description: "NULL = configurazione di sistema (default Mister). Stringa = config specifica per la federazione indicata."
        version:
          type: string
          example: "v1.0"
        configJson:
          $ref: "#/components/schemas/VotoMisterConfigPayload"
        status:
          $ref: "#/components/schemas/VotoAlgorithmConfigStatus"
        isProtected:
          type: boolean
        notes:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    VotoAlgorithmConfigCreate:
      type: object
      required: [version, configJson, status]
      properties:
        federationId:
          type: string
          nullable: true
        version:
          type: string
        configJson:
          $ref: "#/components/schemas/VotoMisterConfigPayload"
        status:
          $ref: "#/components/schemas/VotoAlgorithmConfigStatus"
        notes:
          type: string
          nullable: true

    VotoAlgorithmConfigUpdate:
      type: object
      description: "Modifica parziale. Tutti i campi opzionali. Se status passa a 'active', la precedente attiva per la stessa federazione viene archiviata atomicamente."
      properties:
        configJson:
          $ref: "#/components/schemas/VotoMisterConfigPayload"
        status:
          $ref: "#/components/schemas/VotoAlgorithmConfigStatus"
        notes:
          type: string
          nullable: true

    VotoAlgorithmRecalculateResponse:
      type: object
      required: [updatedCount, skippedCount, durationMs]
      properties:
        updatedCount:
          type: integer
          description: Righe player_giornata_stats con voto_mister aggiornato
        skippedCount:
          type: integer
          description: Righe sotto soglia minuti (voto_mister resta NULL)
        durationMs:
          type: integer

    # ─── COMPETITION MATCHES + STANDINGS ─────────────────────
    MatchTeam:
      type: object
      required: [id, name, colorPrimary, colorSecondary]
      properties:
        id:
          type: string
        name:
          type: string
        code3:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        colorPrimary:
          type: string
        colorSecondary:
          type: string

    CompetitionMatch:
      type: object
      required: [id, round, homeTeam, awayTeam, status]
      properties:
        id:
          type: integer
        round:
          type: integer
        homeTeam:
          $ref: "#/components/schemas/MatchTeam"
        awayTeam:
          $ref: "#/components/schemas/MatchTeam"
        homeScore:
          type: ["number", "null"]
        awayScore:
          type: ["number", "null"]
        playedAt:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [played, upcoming]

    CompetitionMatchesResponse:
      type: object
      required: [matches]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionMatch"

    StandingsEntry:
      type: object
      required: [position, fantaTeam, playedMatches, wins, draws, losses, goalsFor, goalsAgainst, goalDifference, points]
      properties:
        position:
          type: integer
        fantaTeam:
          $ref: "#/components/schemas/MatchTeam"
        playedMatches:
          type: integer
        wins:
          type: integer
        draws:
          type: integer
        losses:
          type: integer
        goalsFor:
          type: number
        goalsAgainst:
          type: number
        goalDifference:
          type: number
        points:
          type: integer

    StandingsResponse:
      type: object
      required: [standings]
      properties:
        standings:
          type: array
          items:
            $ref: "#/components/schemas/StandingsEntry"

    # ─── LINEUPS ──────────────────────────────────────────────
    MatchInfo:
      type: object
      required: [id, giornata, matchOrder, homeFantaTeamId, homeTeamName, awayFantaTeamId, awayTeamName]
      properties:
        id:
          type: integer
        giornata:
          type: integer
        matchOrder:
          type: integer
        homeFantaTeamId:
          type: string
        homeTeamName:
          type: string
        homeScore:
          type: ["number", "null"]
        awayFantaTeamId:
          type: string
        awayTeamName:
          type: string
        awayScore:
          type: ["number", "null"]
        playedAt:
          type: ["string", "null"]
          format: date-time

    LineupPlayer:
      type: object
      required: [playerId, slotPosition, slotIndex, isStarter]
      properties:
        playerId:
          type: integer
        slotPosition:
          type: string
          enum: [GK, DEF, MID, T, ATT]
        slotIndex:
          type: integer
          description: "1–11 per titolari, 12+ per panchina"
        isStarter:
          type: boolean
        benchOrder:
          type: ["integer", "null"]
          description: Ordine di priorità in panchina (1 = prima riserva)

    Lineup:
      type: object
      required: [id, fantaTeamId, season, round, module, players]
      properties:
        id:
          type: integer
        fantaTeamId:
          type: string
        season:
          type: integer
        round:
          type: integer
        module:
          type: string
          example: "4-3-3"
        captainPlayerId:
          type: ["integer", "null"]
        submittedAt:
          type: ["string", "null"]
          format: date-time
        lockedAt:
          type: ["string", "null"]
          format: date-time
        players:
          type: array
          items:
            $ref: "#/components/schemas/LineupPlayer"

    LineupInput:
      type: object
      required: [fantaTeamId, season, round, module, players]
      properties:
        fantaTeamId:
          type: string
        season:
          type: integer
        round:
          type: integer
        module:
          type: string
          example: "4-3-3"
        captainPlayerId:
          type: ["integer", "null"]
        players:
          type: array
          items:
            $ref: "#/components/schemas/LineupPlayer"

    ValidationErrors:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: string

    RosterPlayer:
      type: object
      required: [id, name, roleClassic, photoUrl, photoCartoonUrl, realTeamName, realTeamId, realTeamColorPrimary, realTeamColorSecondary, logoUrl, votoMister]
      properties:
        id:
          type: integer
        name:
          type: string
        roleClassic:
          type: string
          enum: [GK, DEF, MID, ATT]
        photoUrl:
          type: string
          nullable: true
        photoCartoonUrl:
          type: string
          nullable: true
        realTeamName:
          type: string
          nullable: true
        realTeamId:
          type: integer
          nullable: true
        realTeamColorPrimary:
          type: string
          nullable: true
        realTeamColorSecondary:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        votoMister:
          type: number
          nullable: true
        opponentCode:
          type: string
          nullable: true
        opponentIsHome:
          type: boolean
          nullable: true

    # ─── AUCTIONS ─────────────────────────────────────────────
    Auction:
      type: object
      required: [id, league_id, status, created_at, timer_seconds, roster_p, roster_d, roster_c, roster_a, undoable, call_mode, role_order]
      properties:
        id:
          type: string
        league_id:
          type: string
        status:
          type: string
          enum: [setup, running, paused, completed, cancelled]
        timer_seconds:
          type: integer
          minimum: 5
          maximum: 30
          default: 8
        roster_p:
          type: integer
          minimum: 1
          default: 3
        roster_d:
          type: integer
          minimum: 1
          default: 8
        roster_c:
          type: integer
          minimum: 1
          default: 8
        roster_a:
          type: integer
          minimum: 1
          default: 6
        undoable:
          type: boolean
          description: "Vero se esiste un'azione annullabile (bid/skip/assign). Server-authoritative."
        call_mode:
          type: string
          enum: [listone, chiamata]
          default: listone
          description: "Modalità di avanzamento: sequenziale (listone) o a chiamata esplicita (chiamata)"
        role_order:
          type: boolean
          default: false
          description: "In chiamata: ordina per ruolo P→D→C→A"
        started_at:
          type: ["string", "null"]
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    AuctionPlayerEntry:
      type: object
      required: [player_id, position, status, name, full_name, role_classic, real_team]
      properties:
        player_id:
          type: integer
        position:
          type: integer
        status:
          type: string
          enum: [pending, sold, skipped, called]
        name:
          type: string
        full_name:
          type: string
        role_classic:
          type: string
          enum: [GK, DEF, MID, ATT]
        real_team:
          type: string
        photo_url:
          type: ["string", "null"]

    AuctionBidItem:
      type: object
      required: [id, auction_id, player_id, fanta_team_id, amount_fm, valid, created_at]
      properties:
        id:
          type: string
        auction_id:
          type: string
        player_id:
          type: integer
        fanta_team_id:
          type: string
        amount_fm:
          type: integer
        valid:
          type: boolean
        created_at:
          type: string
          format: date-time

    AuctionProgress:
      type: object
      required: [current, total, sold]
      properties:
        current:
          type: integer
        total:
          type: integer
        sold:
          type: integer

    AuctionState:
      type: object
      required: [auction, bids_history, squadre, progress, assignments]
      properties:
        auction:
          $ref: "#/components/schemas/Auction"
        current_player:
          oneOf:
            - $ref: "#/components/schemas/AuctionPlayerEntry"
            - type: "null"
        current_bid:
          oneOf:
            - $ref: "#/components/schemas/AuctionBidItem"
            - type: "null"
        bids_history:
          type: array
          items:
            $ref: "#/components/schemas/AuctionBidItem"
        squadre:
          type: array
          items:
            $ref: "#/components/schemas/FantaTeam"
        progress:
          $ref: "#/components/schemas/AuctionProgress"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/AuctionAssignmentItem"

    AuctionAssignmentItem:
      type: object
      required: [player_id, player_name, role_classic, fanta_team_id, final_price_fm]
      properties:
        player_id:
          type: integer
        player_name:
          type: string
        role_classic:
          type: string
          enum: [GK, DEF, MID, ATT]
        fanta_team_id:
          type: string
        final_price_fm:
          type: integer

    CreateAuctionBody:
      type: object
      required: [league_id]
      properties:
        league_id:
          type: string
        timer_seconds:
          type: integer
          minimum: 5
          maximum: 30
          default: 8
        roster_p:
          type: integer
          minimum: 1
          default: 3
          description: "Slot portieri per squadra"
        roster_d:
          type: integer
          minimum: 1
          default: 8
          description: "Slot difensori per squadra"
        roster_c:
          type: integer
          minimum: 1
          default: 8
          description: "Slot centrocampisti per squadra"
        roster_a:
          type: integer
          minimum: 1
          default: 6
          description: "Slot attaccanti per squadra"
        team_names:
          type: object
          additionalProperties:
            type: string
          description: "Mappa teamId -> nome voce (sovrascrive nome_asta)"
        call_mode:
          type: string
          enum: [listone, chiamata]
          default: listone
        role_order:
          type: boolean
          default: false

    CreateAuctionResponse:
      type: object
      required: [auction, total_players]
      properties:
        auction:
          $ref: "#/components/schemas/Auction"
        current_player_id:
          type: ["integer", "null"]
        total_players:
          type: integer

    CreateAuctionBidBody:
      type: object
      required: [player_id, fanta_team_id, amount_fm]
      properties:
        player_id:
          type: integer
        fanta_team_id:
          type: string
        amount_fm:
          type: integer
          minimum: 1

    CreateAuctionBidResponse:
      type: object
      required: [bid, new_current_bid]
      properties:
        bid:
          $ref: "#/components/schemas/AuctionBidItem"
        new_current_bid:
          $ref: "#/components/schemas/AuctionBidItem"

    AuctionPlayerActionBody:
      type: object
      required: [player_id]
      properties:
        player_id:
          type: integer

    AuctionActionResponse:
      type: object
      required: [auction_completed]
      properties:
        next_player_id:
          type: ["integer", "null"]
        auction_completed:
          type: boolean

    UndoAuctionResponse:
      type: object
      required: [undone]
      properties:
        undone:
          type: string
          enum: [bid, skip, assign]
        message:
          type: string

    ManualAddBody:
      type: object
      required: [fanta_team_id, player_id, price_fm]
      properties:
        fanta_team_id:
          type: string
        player_id:
          type: integer
        price_fm:
          type: integer
          minimum: 1

    ManualRemoveBody:
      type: object
      required: [fanta_team_id, player_id]
      properties:
        fanta_team_id:
          type: string
        player_id:
          type: integer

    ManualSetBudgetBody:
      type: object
      required: [fanta_team_id, credits_remaining]
      properties:
        fanta_team_id:
          type: string
        credits_remaining:
          type: integer
          minimum: 0

    ManualUpdatePriceBody:
      type: object
      required: [fanta_team_id, player_id, new_price_fm]
      properties:
        fanta_team_id:
          type: string
        player_id:
          type: integer
        new_price_fm:
          type: integer
          minimum: 1

    ManualUpdatePriceResponse:
      type: object
      required: [ok, old_price_fm, new_price_fm, credits_delta]
      properties:
        ok:
          type: boolean
        old_price_fm:
          type: integer
        new_price_fm:
          type: integer
        credits_delta:
          type: integer
          description: "Variazione crediti (positivo = rimborso, negativo = addebito)"
        message:
          type: string

    ManualChangeResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: string

    CallPlayerBody:
      type: object
      required: [player_id]
      properties:
        player_id:
          type: integer

    CallPlayerResponse:
      type: object
      required: [ok, player_id]
      properties:
        ok:
          type: boolean
        player_id:
          type: integer
        message:
          type: string
